<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <script type="module" src="scripts.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Calculator</h1>
    <div class="container">
      <div class="display">
        <div class="upperDisplay"></div>
        <div class="lowerDisplay"></div>
      </div>
      <div class="buttons">
        <button class="cbutton">CA</button>
        <button class="cbutton">C</button>
        <button class="stoButton">STO/ RCL</button>
        <button class="opbutton">/</button>

        <button class="number">7</button>
        <button class="number">8</button>
        <button class="number">9</button>
        <button class="opbutton">X</button>

        <button class="number">4</button>
        <button class="number">5</button>
        <button class="number">6</button>
        <button class="opbutton">-</button>

        <button class="number">1</button>
        <button class="number">2</button>
        <button class="number">3</button>
        <button class="opbutton">+</button>

        <button class="number">0</button>
        <button class="number">.</button>
        <button class="number">+/-</button>
        <button class="equals">=</button>
      </div>
    </div>
    <div class="instructions">
      <h2>How to use STO/RCL button</h2>
      <p>
        Press STO/RCL then 1, 2, or 3 to store the current value in 1, 2, or 3.
        Press STO/RCL then 4, 5, or 6 to recall the value in 1, 2, or 3.
      </p>
    </div>
  </body>
</html>
